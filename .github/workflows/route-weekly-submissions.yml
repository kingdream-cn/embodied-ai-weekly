name: Route weekly submissions and update participation

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 周刊期号（例如 48）
        required: true
        type: number
      completed:
        description: 本期提交过的应交成员人数（按成员去重）
        required: true
        type: number
      expected:
        description: 本期应投稿人数
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { submissionWindow, isSubmission, windowDescription, participationDescription } =
              await import(`${process.env.GITHUB_WORKSPACE}/scripts/submission-milestones.mjs`);
            const repo = context.repo;
            const { issues } = github.rest;
            const findMilestone = async (title) => (await github.paginate(
              issues.listMilestones, { ...repo, state: 'all', per_page: 100 },
            )).find((item) => item.title === title);

            if (context.eventName === 'workflow_dispatch') {
              const { issue_number, completed, expected } = context.payload.inputs;
              const edition = Number(issue_number);
              if (!/^\d+$/.test(issue_number) || !Number.isSafeInteger(edition) || edition < 1
                  || !/^\d+$/.test(completed) || !/^\d+$/.test(expected)) {
                throw new Error('请填写有效的期号与人数。');
              }
              const milestone = await findMilestone(`第${edition}期`);
              if (!milestone) throw new Error(`找不到第${edition}期 Milestone。`);
              const description = participationDescription(milestone.description, Number(completed), Number(expected));
              if (description !== milestone.description) {
                await issues.updateMilestone({ ...repo, milestone_number: milestone.number, description });
              }
              return;
            }

            const issue_number = context.payload.issue.number;
            const { data: issue } = await issues.get({ ...repo, issue_number });
            const initialMilestone = context.payload.issue.milestone?.number;
            if (!isSubmission(issue) || issue.milestone?.number !== initialMilestone) return;
            const window = submissionWindow(issue.created_at);
            if (!window) return;
            let milestone = await findMilestone(window.title);
            if (!milestone) {
              try {
                ({ data: milestone } = await issues.createMilestone({
                  ...repo, title: window.title, description: windowDescription(window),
                  due_on: new Date(window.end).toISOString(),
                }));
              } catch (error) {
                if (error.status !== 422) throw error;
                milestone = await findMilestone(window.title);
                if (!milestone) throw error;
              }
            }
            const { data: current } = await issues.get({ ...repo, issue_number });
            if (current.milestone?.number === initialMilestone && initialMilestone !== milestone.number) {
              await issues.update({ ...repo, issue_number, milestone: milestone.number });
            }
